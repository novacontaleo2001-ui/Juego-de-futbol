<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fútbol 3D Arcade</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a1f0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none;
  }
  #game-container { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  #hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; padding-top: 14px; pointer-events: none; z-index: 10; }
  #scoreboard { background: rgba(10,20,10,0.55); color: #fff; padding: 8px 22px; border-radius: 14px; font-size: 18px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
  #scoreboard .blue { color: #60a5fa; } #scoreboard .red { color: #f87171; }
  #instructions { position: fixed; top: 60px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 10; transition: opacity 1s ease; }
  #instructions span { background: rgba(10,20,10,0.55); color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 13px; max-width: 80%; text-align: center; }
  #goal-message { position: fixed; top: 40%; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 20; font-size: 42px; font-weight: 900; color: #4ade80; text-shadow: 0 2px 12px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s ease; }
  #joystick-base { position: fixed; left: 30px; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.4); z-index: 15; touch-action: none; }
  #joystick-stick { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.85); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #shoot-btn { position: fixed; right: 34px; bottom: 40px; width: 90px; height: 90px; border-radius: 50%; background: rgba(239,68,68,0.85); border: 2px solid rgba(255,255,255,0.5); color: white; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; z-index: 15; touch-action: none; user-select: none; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  #shoot-btn:active { transform: scale(0.92); }
</style>
</head>
<body>

<div id="game-container"></div>
<div id="hud-top">
  <div id="scoreboard">
    <span class="blue">TÚ</span><span id="score-blue">0</span><span>-</span><span id="score-red">0</span><span class="red">CPU</span>
  </div>
</div>
<div id="instructions"><span>Mueve el joystick para correr · Toca el botón rojo para disparar</span></div>
<div id="goal-message">¡GOL!</div>
<div id="joystick-base"><div id="joystick-stick"></div></div>
<div id="shoot-btn">TIRO</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";
  const FIELD_L = 100, FIELD_W = 60;
  const GOAL_W = 16, GOAL_H = 7, GOAL_D = 3;
  const BALL_R = 0.6;
  const PLAYER_SPEED = 16;
  const AI_SPEED = 12;
  const SHOT_POWER = 30;
  const KICK_RANGE = 2.6;

  let scene, camera, renderer, clock;
  let ball, ballVel = new THREE.Vector3(0,0,0);
  let player, playerFacing = new THREE.Vector2(1,0);
  let moveInput = new THREE.Vector2(0,0);
  let scoreBlue = 0, scoreRed = 0;
  let paused = false;
  const aiPlayers = [];

  init();
  animate();

  function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd3ff);
    scene.fog = new THREE.Fog(0x8fd3ff, 60, 140);
    camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 400);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    document.getElementById('game-container').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(30, 50, 20);
    scene.add(dir);

    buildField();
    buildGoals();
    ball = buildBall();
    scene.add(ball);

    player = buildCharacter(0x3b82f6, 0xffe0bd);
    player.position.set(-20, 0, 0);
    scene.add(player);

    addAI(-46, 0, 'blue', true);
    addAI(20, -8, 'red', false);
    addAI(14, 10, 'red', false);
    addAI(46, 0, 'red', true);

    clock = new THREE.Clock();
    resetPositions();

    window.addEventListener('resize', onResize);
    setupControls();

    setTimeout(() => {
      const el = document.getElementById('instructions');
      if (el) el.style.opacity = '0';
    }, 4500);
  }

  function onResize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function buildField(){
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 614;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#2f9e44';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i=0; i<10; i++){ if (i%2===0) ctx.fillRect(i*(canvas.width/10), 0, canvas.width/10, canvas.height); }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
    const m = 30;
    ctx.strokeRect(m, m, canvas.width-2*m, canvas.height-2*m);
    ctx.beginPath(); ctx.moveTo(canvas.width/2, m); ctx.lineTo(canvas.width/2, canvas.height-m); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 70, 0, Math.PI*2); ctx.stroke();
    ctx.strokeRect(m, canvas.height/2-110, 110, 220);
    ctx.strokeRect(canvas.width-m-110, canvas.height/2-110, 110, 220);
    ctx.strokeRect(m, canvas.height/2-60, 45, 120);
    ctx.strokeRect(canvas.width-m-45, canvas.height/2-60, 45, 120);

    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = 4;
    const field = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_L, FIELD_W), new THREE.MeshLambertMaterial({ map: texture }));
    field.rotation.x = -Math.PI/2;
    scene.add(field);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x1f6f3f }));
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -0.02;
    scene.add(ground);
  }

  function buildGoalFrame(x, sign){
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const postGeo = new THREE.CylinderGeometry(0.15, 0.15, GOAL_H, 8);
    const p1 = new THREE.Mesh(postGeo, mat); p1.position.set(0, GOAL_H/2, -GOAL_W/2);
    const p2 = new THREE.Mesh(postGeo, mat); p2.position.set(0, GOAL_H/2, GOAL_W/2);
    const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, GOAL_W, 8), mat);
    cross.rotation.z = Math.PI/2; cross.position.set(0, GOAL_H, 0);
    const backGeo = new THREE.CylinderGeometry(0.12,0.12, GOAL_H, 8);
    const b1 = new THREE.Mesh(backGeo, mat); b1.position.set(-sign*GOAL_D, GOAL_H/2, -GOAL_W/2);
    const b2 = new THREE.Mesh(backGeo, mat); b2.position.set(-sign*GOAL_D, GOAL_H/2, GOAL_W/2);
    const net = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_H), new THREE.MeshLambertMaterial({ color: 0xffffff, transparent:true, opacity:0.25, side: THREE.DoubleSide }));
    net.position.set(-sign*GOAL_D, GOAL_H/2, 0); net.rotation.y = Math.PI/2;
    group.add(p1,p2,cross,b1,b2,net);
    group.position.x = x;
    return group;
  }

  function buildGoals(){
    scene.add(buildGoalFrame(-FIELD_L/2, -1));
    scene.add(buildGoalFrame(FIELD_L/2, 1));
  }

  function buildBall(){
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }));
    mesh.position.y = BALL_R;
    return mesh;
  }

  function buildCharacter(bodyColor, skinColor){
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: bodyColor });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.7), bodyMat);
    body.position.y = 1.0;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 12), new THREE.MeshLambertMaterial({ color: skinColor }));
    head.position.y = 1.95;
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 6), bodyMat);
    nose.position.set(0, 1.0, 0.5); nose.rotation.x = Math.PI/2;
    group.add(body, head, nose);
    return group;
  }

  function addAI(x, z, team, isGK){
    const color = team === 'red' ? 0xef4444 : 0x60a5fa;
    const mesh = buildCharacter(isGK ? 0xfacc15 : color, 0xffe0bd);
    mesh.position.set(x, 0, z);
    scene.add(mesh);
    aiPlayers.push({ mesh, team, isGK, kickCooldown: 0, homeX: x, homeZ: z });
  }

  function setupControls(){
    const base = document.getElementById('joystick-base');
    const stick = document.getElementById('joystick-stick');
    let dragging = false, baseRect = null, activeId = null;
    const maxDist = 40;

    function start(e){
      dragging = true; activeId = e.pointerId;
      baseRect = base.getBoundingClientRect();
      base.setPointerCapture(e.pointerId);
      moveJoystick(e);
    }
    function moveJoystick(e){
      if (!dragging || e.pointerId !== activeId) return;
      const cx = baseRect.left + baseRect.width/2, cy = baseRect.top + baseRect.height/2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const dist = Math.min(Math.hypot(dx,dy), maxDist);
      const angle = Math.atan2(dy,dx);
      dx = Math.cos(angle)*dist; dy = Math.sin(angle)*dist;
      stick.style.transform = `translate(${dx-27}px, ${dy-27}px)`;
      moveInput.set(dx/maxDist, dy/maxDist);
    }
    function end(e){
      if (e.pointerId !== activeId) return;
      dragging = false; activeId = null;
      stick.style.transform = 'translate(-50%, -50%)';
      moveInput.set(0,0);
    }
    base.addEventListener('pointerdown', start);
    base.addEventListener('pointermove', moveJoystick);
    base.addEventListener('pointerup', end);
    base.addEventListener('pointercancel', end);

    document.getElementById('shoot-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); tryShoot(); });

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') tryShoot(); });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
    setInterval(() => {
      if (dragging) return;
      let kx = 0, kz = 0;
      if (keys['arrowup'] || keys['w']) kz -= 1;
      if (keys['arrowdown'] || keys['s']) kz += 1;
      if (keys['arrowleft'] || keys['a']) kx -= 1;
      if (keys['arrowright'] || keys['d']) kx += 1;
      if (kx !== 0 || kz !== 0){ const len = Math.hypot(kx,kz); moveInput.set(kx/len, kz/len); }
      else if (!dragging){ moveInput.set(0,0); }
    }, 16);
  }

  function tryShoot(){
    if (paused) return;
    const dist = Math.hypot(player.position.x - ball.position.x, player.position.z - ball.position.z);
    if (dist < KICK_RANGE){
      ballVel.x = playerFacing.x * SHOT_POWER;
      ballVel.z = playerFacing.y * SHOT_POWER;
      ballVel.y = 0.5;
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused){ updatePlayer(dt); updateAI(dt); updateBall(dt); }
    updateCamera(dt);
    renderer.render(scene, camera);
  }

  function updatePlayer(dt){
    if (moveInput.lengthSq() > 0.02){
      const mx = moveInput.x, mz = moveInput.y;
      player.position.x += mx * PLAYER_SPEED * dt;
      player.position.z += mz * PLAYER_SPEED * dt;
      playerFacing.set(mx, mz).normalize();
      player.rotation.y = Math.atan2(playerFacing.x, playerFacing.y);
    }
    player.position.x = clamp(player.position.x, -FIELD_L/2+1, FIELD_L/2-1);
    player.position.z = clamp(player.position.z, -FIELD_W/2+1, FIELD_W/2-1);
    dribble(player.position);
  }

  function dribble(pos){
    const dx = ball.position.x - pos.x, dz = ball.position.z - pos.z;
    const dist = Math.hypot(dx,dz);
    if (dist < 1.4 && dist > 0.01){
      const push = (1.4 - dist) * 6;
      ballVel.x += (dx/dist) * push * 0.15;
      ballVel.z += (dz/dist) * push * 0.15;
    }
  }

  function updateAI(dt){
    aiPlayers.forEach(ai => {
      ai.kickCooldown = Math.max(0, ai.kickCooldown - dt);
      const m = ai.mesh;
      if (ai.isGK){
        const targetZ = clamp(ball.position.z, -GOAL_W/2+1, GOAL_W/2-1);
        m.position.z += clamp(targetZ - m.position.z, -AI_SPEED*dt, AI_SPEED*dt);
        m.position.x = ai.homeX;
        const dist = Math.hypot(m.position.x-ball.position.x, m.position.z-ball.position.z);
        if (dist < KICK_RANGE + 0.6 && ai.kickCooldown <= 0){
          const targetX = ai.team === 'blue' ? FIELD_L/2 : -FIELD_L/2;
          const dir = new THREE.Vector2(targetX - m.position.x, (Math.random()-0.5)*20 - m.position.z).normalize();
          ballVel.x = dir.x * 22; ballVel.z = dir.y * 22; ballVel.y = 0.4;
          ai.kickCooldown = 1.5;
        }
        return;
      }
      const dx = ball.position.x - m.position.x, dz = ball.position.z - m.position.z;
      const dist = Math.hypot(dx,dz);
      if (dist > KICK_RANGE){
        const nx = dx/dist, nz = dz/dist;
        m.position.x += nx * AI_SPEED * dt; m.position.z += nz * AI_SPEED * dt;
        m.rotation.y = Math.atan2(nx, nz);
      } else if (ai.kickCooldown <= 0){
        const targetX = ai.team === 'red' ? -FIELD_L/2 : FIELD_L/2;
        const targetZ = (Math.random()-0.5) * (GOAL_W*0.6);
        const dir = new THREE.Vector2(targetX - m.position.x, targetZ - m.position.z).normalize();
        ballVel.x = dir.x * 24; ballVel.z = dir.y * 24; ballVel.y = 0.4;
        ai.kickCooldown = 1.2 + Math.random();
      }
      m.position.x = clamp(m.position.x, -FIELD_L/2+1, FIELD_L/2-1);
      m.position.z = clamp(m.position.z, -FIELD_W/2+1, FIELD_W/2-1);
    });
  }

  function updateBall(dt){
    ball.position.x += ballVel.x * dt;
    ball.position.z += ballVel.z * dt;
    ballVel.x *= 0.985; ballVel.z *= 0.985;
    ball.position.y = BALL_R;

    if (ball.position.z > FIELD_W/2 - BALL_R){ ball.position.z = FIELD_W/2 - BALL_R; ballVel.z *= -0.5; }
    if (ball.position.z < -FIELD_W/2 + BALL_R){ ball.position.z = -FIELD_W/2 + BALL_R; ballVel.z *= -0.5; }

    if (ball.position.x > FIELD_L/2 - BALL_R){
      if (Math.abs(ball.position.z) < GOAL_W/2 - BALL_R) scoreGoal('blue');
      else { ball.position.x = FIELD_L/2 - BALL_R; ballVel.x *= -0.5; }
    }
    if (ball.position.x < -FIELD_L/2 + BALL_R){
      if (Math.abs(ball.position.z) < GOAL_W/2 - BALL_R) scoreGoal('red');
      else { ball.position.x = -FIELD_L/2 + BALL_R; ballVel.x *= -0.5; }
    }
    ball.rotation.x += ballVel.z * dt * 0.5;
    ball.rotation.z -= ballVel.x * dt * 0.5;
  }

  function scoreGoal(team){
    if (paused) return;
    paused = true;
    if (team === 'blue') scoreBlue++; else scoreRed++;
    document.getElementById('score-blue').textContent = scoreBlue;
    document.getElementById('score-red').textContent = scoreRed;
    const msg = document.getElementById('goal-message');
    msg.style.opacity = '1';
    setTimeout(() => { msg.style.opacity = '0'; resetPositions(); paused = false; }, 1600);
  }

  function resetPositions(){
    ball.position.set(0, BALL_R, 0);
    ballVel.set(0,0,0);
    player.position.set(-20, 0, 0);
    playerFacing.set(1,0);
    aiPlayers.forEach(ai => ai.mesh.position.set(ai.homeX, 0, ai.homeZ));
  }

  function updateCamera(dt){
    const camOffset = new THREE.Vector3(-playerFacing.x*14, 9, -playerFacing.y*14);
    const desired = new THREE.Vector3(player.position.x + camOffset.x, camOffset.y, player.position.z + camOffset.z);
    camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
    camera.lookAt(new THREE.Vector3(player.position.x + playerFacing.x*6, 1.2, player.position.z + playerFacing.y*6));
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
})();
</script>
</body>
</html>
